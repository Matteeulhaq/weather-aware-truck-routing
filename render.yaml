# Render Blueprint: one free web service serving the Django API and the
# built React app (WhiteNoise). Deploy via "New + -> Blueprint" in Render.
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: python
    plan: free
    healthCheckPath: /api/health/
    buildCommand: |
      node -v || (echo "Node missing on build image" && exit 1)
      pip install -r backend/requirements.txt
      npm ci --prefix client
      npm run build --prefix client
      python backend/manage.py migrate --noinput
      python backend/manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ORS_API_KEY
        sync: false
      # Build-time input for Vite — inlined into the client bundle by the build.
      - key: VITE_CARTO_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
